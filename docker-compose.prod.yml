# Sensei Hub — 本番用（ECR のビルド済みイメージを pull して起動する）。
#
# EC2 ではこのファイルでイメージをビルドせず、ECR から pull するだけにする。
# 使い方（EC2 上、このファイルの隣に .env を置く）:
#   export ECR_IMAGE=<account>.dkr.ecr.<region>.amazonaws.com/sensei-hub:latest
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# .env に必要なキー:
#   ECR_IMAGE          … 上記の ECR イメージ URI（タグ付き）
#   CLERK_SECRET_KEY   … Clerk のシークレットキー（実行時）
# NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY はビルド時にイメージへ埋め込み済みのため、
# ここでは不要（変更時はビルドし直して push する）。

services:
  web:
    image: ${ECR_IMAGE}
    container_name: sensei-hub-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "file:/app/data/production.db"
      LESSONS_DIR: /lessons
      LESSONS_INDEX_PATH: /app/data/lessons-index.json
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
    volumes:
      # 学習進捗 DB と生成インデックスを再デプロイ後も保持する
      - web_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  web_data:
