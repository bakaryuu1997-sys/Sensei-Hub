name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sensei-hub-dashboard
    env:
      # ビルド時に必要な値（CI 用ダミー。実値はデプロイ環境で設定）
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
      CLERK_SECRET_KEY: sk_test_ci-placeholder
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /login
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /register
      DATABASE_URL: file:./ci.db
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: sensei-hub-dashboard/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test:unit

      - name: Build
        run: pnpm build

  # ログイン込み E2E。Clerk のテスト用シークレットが設定されている時だけ実行する。
  # 未設定なら各ステップを丸ごとスキップし、ジョブは緑のまま（ユニット/ビルドは常時実行）。
  e2e:
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: sensei-hub-dashboard
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.E2E_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
      E2E_CLERK_USER_USERNAME: ${{ secrets.E2E_CLERK_USER_USERNAME }}
      E2E_CLERK_USER_PASSWORD: ${{ secrets.E2E_CLERK_USER_PASSWORD }}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /login
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /register
      DATABASE_URL: file:./e2e.db
    steps:
      - name: Detect E2E secrets
        id: guard
        # checkout 前に走るため、ジョブ既定の working-directory(sensei-hub-dashboard) は
        # まだ存在しない。ワークスペース直下で実行して "No such file or directory" を防ぐ。
        working-directory: ${{ github.workspace }}
        run: |
          if [ -n "${{ secrets.E2E_CLERK_USER_USERNAME }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "E2E secrets not set — skipping login E2E."
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.enabled == 'true'

      - uses: pnpm/action-setup@v4
        if: steps.guard.outputs.enabled == 'true'
        with:
          version: 10

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.enabled == 'true'
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: sensei-hub-dashboard/pnpm-lock.yaml

      - name: Install dependencies
        if: steps.guard.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        if: steps.guard.outputs.enabled == 'true'
        run: pnpm prisma generate

      - name: Install Playwright browser
        if: steps.guard.outputs.enabled == 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        if: steps.guard.outputs.enabled == 'true'
        run: pnpm test:e2e

  # 本番デプロイ。main への push かつデプロイ用シークレットが揃っている時だけ実行。
  # build（lint/test/build）が緑になってから動く。シークレット未設定なら丸ごとスキップ。
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: deploy-main
      cancel-in-progress: false
    env:
      AWS_REGION: ap-southeast-2
      ECR_REPO: sensei-hub
    steps:
      - name: Detect deploy secrets
        id: guard
        run: |
          if [ -n "${{ secrets.AWS_ACCESS_KEY_ID }}" ] && [ -n "${{ secrets.EC2_SSH_KEY }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Deploy secrets not set — skipping deploy (CI stays green)."
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.enabled == 'true'

      - name: Configure AWS credentials
        if: steps.guard.outputs.enabled == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: steps.guard.outputs.enabled == 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        if: steps.guard.outputs.enabled == 'true'
        env:
          ECR_URI: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}
          PUBK: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          VAPK: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
        run: |
          # ビルドコンテキストはリポジトリルート（Dockerfile はルート・lessons/ を含む）。
          docker build \
            --build-arg NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY="$PUBK" \
            --build-arg NEXT_PUBLIC_VAPID_PUBLIC_KEY="$VAPK" \
            -t "$ECR_URI:latest" -t "$ECR_URI:${{ github.sha }}" .
          docker push "$ECR_URI:latest"
          docker push "$ECR_URI:${{ github.sha }}"

      - name: Deploy on EC2 over SSH
        if: steps.guard.outputs.enabled == 'true'
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem
          # --force-recreate で、同じ latest タグでもイメージ更新時に確実にコンテナを作り直す。
          ssh -i ~/.ssh/ec2.pem -o StrictHostKeyChecking=no -o ServerAliveInterval=15 -o ConnectTimeout=30 "ubuntu@$EC2_HOST" "set -e; cd ~/sensei-hub && aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin $ECR_REGISTRY && docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d --force-recreate && docker image prune -f"
          echo "Deployed ${{ github.sha }} to EC2."
