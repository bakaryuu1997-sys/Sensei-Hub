# Sensei Hub — 単一インスタンス向けデプロイ（例: AWS EC2 1 台）。
#
# EC2 での使い方:
#   1. このファイルの隣の `.env` に下記の秘密情報を記載（キーは下記参照）。
#   2. docker compose up -d --build
#
# アプリは SQLite（libSQL アダプター）を使い、独立した DB サーバーは無い。
# NEXT_PUBLIC_* はビルド時に埋め込まれるためビルド引数で渡す。変更時は
# `docker compose up -d --build` が必要。

services:
  web:
    build:
      context: .
      dockerfile: ./sensei-hub-dashboard/Dockerfile
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
        NEXT_PUBLIC_CLERK_SIGN_IN_URL: /login
        NEXT_PUBLIC_CLERK_SIGN_UP_URL: /register
    container_name: sensei-hub-web
    restart: always
    ports:
      - "3000:3000"
    environment:
      # SQLite ファイルは /app/data にマウントした永続ボリューム上に置く
      DATABASE_URL: "file:/app/data/production.db"
      LESSONS_DIR: /lessons
      # /lessons は読み取り専用なので、生成インデックスは書き込み可能なボリュームへ
      LESSONS_INDEX_PATH: /app/data/lessons-index.json
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /login
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /register
    volumes:
      # 学習進捗 DB を再デプロイ後も保持する
      - web_data:/app/data
      # レッスンコンテンツ（読み取り専用）。更新は git pull + 再デプロイ
      - ./lessons:/lessons:ro

volumes:
  web_data:
